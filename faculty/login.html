<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Mentor Login | Smart Campus Internship System</title>
    <link rel="stylesheet" href="../assets/css/shared.css">
    <link rel="stylesheet" href="faculty.css">
</head>

<body class="auth-page">

    <div class="auth-card">
        <div style="margin-bottom: 1.25rem;">
            <a href="../index.html"
                style="font-size: 0.85rem; color: var(--text-muted); display: inline-flex; align-items: center; gap: 0.4rem;">
                ← Back to Portal Gateway
            </a>
        </div>

        <div class="auth-header">
            <div class="auth-badge faculty-badge">👩‍🏫 Faculty Mentor Portal</div>
            <h2 class="auth-title">Mentor Sign In</h2>
            <p class="auth-subtitle">Verify student NOC clearances and evaluate internship logs</p>
        </div>

        <div id="login-error-msg"
            style="display: none; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: #fda4af; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1.25rem;">
        </div>

        <form id="faculty-login-form">
            <div class="form-group">
                <label class="form-label" for="faculty-email">Faculty Email Address</label>
                <input type="email" id="faculty-email" class="form-control" placeholder="arun@campus.edu" required>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label class="form-label" for="faculty-password" style="margin-bottom: 0;">Security Password</label>
                    <span style="font-size: 0.78rem; color: var(--accent-cyan); cursor: pointer;"
                        onclick="alert('Demo password: faculty123')">Forgot password?</span>
                </div>
                <input type="password" id="faculty-password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary"
                style="width: 100%; margin-top: 0.5rem; background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);">
                Sign In to Mentor Console
            </button>
        </form>

        <div class="auth-demo-credentials">
            <strong>🚀 Demo Faculty Account:</strong><br>
            Email: <code>arun@campus.edu</code> | Pass: <code>faculty123</code>
            <div style="margin-top: 0.6rem;">
                <button type="button" class="btn btn-secondary btn-sm" style="width: 100%; font-size: 0.78rem;"
                    id="quick-fill-btn">
                    Auto-Fill Faculty Credentials
                </button>
            </div>
        </div>

        <div class="auth-footer">
            New faculty guide? <a href="register.html" style="color: var(--accent-cyan);">Register new faculty
                account</a>
        </div>
    </div>

    <script src="../assets/js/data.js"></script>
    <script>
        document.getElementById("quick-fill-btn").addEventListener("click", () => {
            document.getElementById("faculty-email").value = "arun@campus.edu";
            document.getElementById("faculty-password").value = "faculty123";
        });

        document.getElementById("faculty-login-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("faculty-email").value.trim();
            const password = document.getElementById("faculty-password").value;
            const errorBox = document.getElementById("login-error-msg");

            const res = SCIMS.login(email, password, "faculty");
            if (res.success) {
                SCIMS.showToast("Welcome Prof. " + res.user.name, "success");
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 400);
            } else {
                errorBox.textContent = res.message;
                errorBox.style.display = "block";
            }
        });
    </script>
</body>

</html>
