<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Portal Login | Smart Campus Internship System</title>
    <link rel="stylesheet" href="../assets/css/shared.css">
    <link rel="stylesheet" href="recruiter.css">
</head>

<body class="auth-page">

    <div class="auth-card">
        <div style="margin-bottom: 1.25rem;">
            <a href="../index.html"
                style="font-size: 0.85rem; color: var(--text-muted); display: inline-flex; align-items: center; gap: 0.4rem;">
                ← Back to Portal Gateway
            </a>
        </div>

        <div class="auth-header">
            <div class="auth-badge recruiter-badge">💼 Corporate Recruiter Portal</div>
            <h2 class="auth-title">Recruiter Login</h2>
            <p class="auth-subtitle">Source top campus engineering talent and manage hiring funnels</p>
        </div>

        <div id="login-error-msg"
            style="display: none; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: #fda4af; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1.25rem;">
        </div>

        <form id="recruiter-login-form">
            <div class="form-group">
                <label class="form-label" for="rec-email">Corporate Work Email</label>
                <input type="email" id="rec-email" class="form-control" placeholder="sarah@google.com" required>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label class="form-label" for="rec-password" style="margin-bottom: 0;">Password</label>
                    <span style="font-size: 0.78rem; color: var(--accent-amber); cursor: pointer;"
                        onclick="alert('Demo password: recruiter123')">Forgot password?</span>
                </div>
                <input type="password" id="rec-password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary"
                style="width: 100%; margin-top: 0.5rem; background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);">
                Sign In to Corporate Console
            </button>
        </form>

        <div class="auth-demo-credentials">
            <strong>🚀 Demo Recruiter Account:</strong><br>
            Email: <code>sarah@google.com</code> | Pass: <code>recruiter123</code>
            <div style="margin-top: 0.6rem;">
                <button type="button" class="btn btn-secondary btn-sm" style="width: 100%; font-size: 0.78rem;"
                    id="quick-fill-btn">
                    Auto-Fill Recruiter Credentials
                </button>
            </div>
        </div>

        <div class="auth-footer">
            New corporate employer? <a href="register.html" style="color: var(--accent-amber);">Register company
                account</a>
        </div>
    </div>

    <script src="../assets/js/data.js"></script>
    <script>
        document.getElementById("quick-fill-btn").addEventListener("click", () => {
            document.getElementById("rec-email").value = "sarah@google.com";
            document.getElementById("rec-password").value = "recruiter123";
        });

        document.getElementById("recruiter-login-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("rec-email").value.trim();
            const password = document.getElementById("rec-password").value;
            const errorBox = document.getElementById("login-error-msg");

            const res = SCIMS.login(email, password, "recruiter");
            if (res.success) {
                SCIMS.showToast(`Welcome back, ${res.user.name} (${res.user.company})`, "success");
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 400);
            } else {
                errorBox.textContent = res.message;
                errorBox.style.display = "block";
            }
        });
    </script>
</body>

</html>
