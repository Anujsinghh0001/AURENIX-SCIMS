<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Smart Campus Internship Management System</title>
    <link rel="stylesheet" href="../assets/css/shared.css">
</head>

<body class="auth-page">

    <div class="auth-card" style="max-width: 620px;">
        <div style="margin-bottom: 1rem;">
            <a href="login.html"
                style="font-size: 0.85rem; color: var(--text-muted); display: inline-flex; align-items: center; gap: 0.4rem;">
                ← Back to Student Login
            </a>
        </div>

        <div class="auth-header">
            <div class="auth-badge">👨‍🎓 Student Registration</div>
            <h2 class="auth-title">Create Student Profile</h2>
            <p class="auth-subtitle">Join the Smart Campus Internship Network</p>
        </div>

        <div id="reg-error-msg"
            style="display: none; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: #fda4af; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1.25rem;">
        </div>

        <form id="student-reg-form">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="reg-name">Full Name *</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="e.g. Aman Gupta" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-roll">Roll / Registration No. *</label>
                    <input type="text" id="reg-roll" class="form-control" placeholder="e.g. CS22B089" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="reg-email">Campus Email *</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="e.g. aman@campus.edu" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-phone">Phone Number</label>
                    <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98765 00000">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="reg-dept">Academic Department *</label>
                    <select id="reg-dept" class="form-control" required>
                        <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Electronics & Communication">Electronics & Communication</option>
                        <option value="Electrical Engineering">Electrical Engineering</option>
                        <option value="Mechanical Engineering">Mechanical Engineering</option>
                        <option value="Data Science & AI">Data Science & AI</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-year">Year & Semester *</label>
                    <select id="reg-year" class="form-control" required>
                        <option value="3rd Year (5th Sem)">3rd Year (5th Sem)</option>
                        <option value="3rd Year (6th Sem)">3rd Year (6th Sem)</option>
                        <option value="4th Year (7th Sem)">4th Year (7th Sem)</option>
                        <option value="4th Year (8th Sem)">4th Year (8th Sem)</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="reg-cgpa">Current CGPA (out of 10) *</label>
                    <input type="number" step="0.01" min="0" max="10" id="reg-cgpa" class="form-control"
                        placeholder="8.75" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-skills">Core Technical Skills (comma separated)</label>
                    <input type="text" id="reg-skills" class="form-control" placeholder="e.g. Java, Python, React, SQL">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="reg-password">Password *</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Min 6 characters"
                        minlength="6" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-confirm">Confirm Password *</label>
                    <input type="password" id="reg-confirm" class="form-control" placeholder="Re-enter password"
                        required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                Complete Registration & Sign In
            </button>
        </form>

        <div class="auth-footer">
            Already registered? <a href="login.html">Sign in here</a>
        </div>
    </div>

    <script src="../assets/js/data.js"></script>
    <script>
        document.getElementById("student-reg-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const password = document.getElementById("reg-password").value;
            const confirm = document.getElementById("reg-confirm").value;
            const errorBox = document.getElementById("reg-error-msg");

            if (password !== confirm) {
                errorBox.textContent = "Passwords do not match.";
                errorBox.style.display = "block";
                return;
            }

            const rawSkills = document.getElementById("reg-skills").value;
            const skillsArr = rawSkills ? rawSkills.split(",").map(s => s.trim()).filter(Boolean) : ["General Tech"];

            const userData = {
                name: document.getElementById("reg-name").value.trim(),
                email: document.getElementById("reg-email").value.trim(),
                password: password,
                role: "student",
                rollNo: document.getElementById("reg-roll").value.trim(),
                department: document.getElementById("reg-dept").value,
                year: document.getElementById("reg-year").value,
                cgpa: document.getElementById("reg-cgpa").value.trim(),
                phone: document.getElementById("reg-phone").value.trim() || "+91 00000 00000",
                skills: skillsArr,
                resumeUrl: "uploaded-resume.pdf",
                avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80"
            };

            const res = SCIMS.register(userData);
            if (res.success) {
                SCIMS.showToast("Account created successfully!", "success");
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 400);
            } else {
                errorBox.textContent = res.message;
                errorBox.style.display = "block";
            }
        });
    </script>
</body>

</html>
